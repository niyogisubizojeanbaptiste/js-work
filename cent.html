<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scientific Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.calc{background:#1e293b;width:100%;max-width:380px;border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.screen{background:#0f172a;border-radius:12px;padding:15px;margin-bottom:15px;text-align:right;min-height:95px;border:1px solid #334155}
#history{color:#64748b;font-size:14px;min-height:18px;word-break:break-all}
#display{color:white;font-size:36px;font-weight:300;word-break:break-all;line-height:1}
.mode{display:flex;gap:8px;margin-bottom:12px}
.mode button{flex:1;padding:6px;border-radius:8px;border:none;background:#334155;color:#94a3b8;font-size:12px;cursor:pointer}
.mode button.active{background:#3b82f6;color:white}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
button{border:none;border-radius:10px;padding:14px 5px;font-size:16px;cursor:pointer;transition:0.1s}
button:active{transform:scale(0.95)}
.num{background:#334155;color:white}
.num:hover{background:#475569}
.op{background:#3b82f6;color:white}
.op:hover{background:#2563eb}
.fn{background:#1e293b;color:#38bdf8;border:1px solid #334155;font-size:13px}
.fn:hover{background:#0f172a}
.eq{background:#22c55e;color:white;grid-column:span 2}
.eq:hover{background:#16a34a}
.clr{background:#ef4444;color:white}
.clr:hover{background:#dc2626}
</style>
</head>
<body>
<div class="calc">
  <div class="screen">
    <div id="history"></div>
    <div id="display">0</div>
  </div>
  <div class="mode">
    <button id="degBtn" class="active" onclick="toggleAngle()">DEG</button>
    <button onclick="insert('(')">(</button>
    <button onclick="insert(')')">)</button>
    <button onclick="back()">⌫</button>
    <button class="clr" onclick="clearAll()">AC</button>
  </div>
  <div class="keys">
    <button class="fn" onclick="insert('sin(')">sin</button>
    <button class="fn" onclick="insert('cos(')">cos</button>
    <button class="fn" onclick="insert('tan(')">tan</button>
    <button class="fn" onclick="insert('log(')">log</button>
    <button class="fn" onclick="insert('ln(')">ln</button>

    <button class="fn" onclick="insert('sqrt(')">√</button>
    <button class="fn" onclick="insert('^')">xʸ</button>
    <button class="fn" onclick="insert('pi')">π</button>
    <button class="fn" onclick="insert('e')">e</button>
    <button class="fn" onclick="insert('!')">x!</button>

    <button class="num" onclick="insert('7')">7</button>
    <button class="num" onclick="insert('8')">8</button>
    <button class="num" onclick="insert('9')">9</button>
    <button class="op" onclick="insert('/')">÷</button>
    <button class="op" onclick="insert('%')">%</button>

    <button class="num" onclick="insert('4')">4</button>
    <button class="num" onclick="insert('5')">5</button>
    <button class="num" onclick="insert('6')">6</button>
    <button class="op" onclick="insert('*')">×</button>
    <button class="fn" onclick="insert('1/')">1/x</button>

    <button class="num" onclick="insert('1')">1</button>
    <button class="num" onclick="insert('2')">2</button>
    <button class="num" onclick="insert('3')">3</button>
    <button class="op" onclick="insert('-')">−</button>
    <button class="fn" onclick="insert('10^')">10ˣ</button>

    <button class="num" onclick="insert('0')">0</button>
    <button class="num" onclick="insert('.')">.</button>
    <button class="fn" onclick="insert('exp(')">EXP</button>
    <button class="op" onclick="insert('+')">+</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
</div>

<script>
let expr = "";
let isDeg = true;
const display = document.getElementById("display");
const history = document.getElementById("history");

function toggleAngle(){
  isDeg = !isDeg;
  document.getElementById("degBtn").innerText = isDeg ? "DEG" : "RAD";
  document.getElementById("degBtn").classList.toggle("active");
}

function insert(v){
  if(v=="pi") v="π";
  if(display.innerText=="0" && !isNaN(v)) expr="";
  if(v=="^") expr+="**";
  else if(v=="sqrt(") expr+="Math.sqrt(";
  else if(v=="sin(") expr+="sin(";
  else if(v=="cos(") expr+="cos(";
  else if(v=="tan(") expr+="tan(";
  else if(v=="log(") expr+="log10(";
  else if(v=="ln(") expr+="Math.log(";
  else if(v=="exp(") expr+="Math.exp(";
  else if(v=="π" || v=="pi") expr+="Math.PI";
  else if(v=="e" && expr.slice(-1)!=="d") expr+="Math.E";
  else if(v=="10^") expr+="10**";
  else if(v=="1/") expr+="1/(";
  else if(v=="!") expr+="!";
  else expr+=v;
  
  updateDisplay();
}

function updateDisplay(){
  let show = expr.replaceAll("**","^").replaceAll("Math.PI","π").replaceAll("Math.E","e").replaceAll("Math.sqrt","√").replaceAll("Math.log","ln").replaceAll("log10","log");
  display.innerText = show || "0";
}

function clearAll(){ expr=""; history.innerText=""; display.innerText="0"; }
function back(){ expr=expr.slice(0,-1); updateDisplay(); }

function factorial(n){
  if(n<0) return NaN;
  if(n==0) return 1;
  let r=1; for(let i=1;i<=n;i++) r*=i; return r;
}

function sin(x){ return isDeg ? Math.sin(x*Math.PI/180) : Math.sin(x); }
function cos(x){ return isDeg ? Math.cos(x*Math.PI/180) : Math.cos(x); }
function tan(x){ return isDeg ? Math.tan(x*Math.PI/180) : Math.tan(x); }
function log10(x){ return Math.log10(x); }

function calculate(){
  try{
    let code = expr;
    // handle factorial: 5! -> factorial(5)
    code = code.replace(/(\d+|\))!/g, (m,g)=>`factorial(${g})`);
    // handle %
    code = code.replace(/%/g,"/100");
    
    history.innerText = display.innerText + " =";
    let result = eval(code);
    
    if(!isFinite(result)) throw "Error";
    // round
    result = Math.round(result*1e10)/1e10;
    
    display.innerText = result;
    expr = String(result);
  }catch(e){
    display.innerText = "Error";
    expr = "";
  }
}

document.addEventListener("keydown", e=>{
  if(e.key>="0" && e.key<="9") insert(e.key);
  if(["+","-","*","/","(",")",".","%"].includes(e.key)) insert(e.key);
  if(e.key=="Enter") calculate();
  if(e.key=="Backspace") back();
  if(e.key=="Escape") clearAll();
});
</script>
<button>
  <a href="Calculator.html">back to simple</a>
</button>
</body>
</html>
